services:
  postgres:
    image: postgres:18.4-bookworm
    ports:
      - "${HOST_BIND_ADDRESS}:${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      TZ: "${TZ:?TZ is required}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    image: redis:8.2.8-bookworm
    ports:
      - "${HOST_BIND_ADDRESS}:${REDIS_HOST_PORT}:6379"
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - --save
      - ""
      - --appendonly
      - "no"
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h 127.0.0.1 -p 6379 ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  postgres-data:
